<template>
    <lightning-card title="Accounts">
        <div class="slds-m-around_medium">
            <lightning-input type="text" label="Search" value={searchKey} onchange={handleSearchKeyChange}></lightning-input>
            <lightning-button label="Search" variant="brand" onclick={handleSearch}></lightning-button>
        </div>
        <template if:true={records}>
             <lightning-card title="Account List">
    <lightning-datatable
      key-field="Id"
      data={accountData}
      columns={accountColumns}
      onrowselection={handleRowSelection}>
    </lightning-datatable>
  </lightning-card>
        </template>
        <template if:true={error}>
            {error}
        </template>
    </lightning-card>
</template>
