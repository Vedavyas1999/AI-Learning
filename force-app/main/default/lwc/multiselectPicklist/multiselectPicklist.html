<template>

	<div class="slds-card">
		<div class="slds-p-around_medium">
			<div class="slds-form-element">
				<div class="slds-form-element__control">
					<div class="slds-combobox_container">
						<div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
							aria-expanded="false" aria-haspopup="listbox" role="combobox">
							<div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
								role="none">
								<lightning-input type="search" id="combobox-id-16" value={userName}
									onchange={searchHandleKeyChange} onkeydown={searchHandleClick}
									onclick={searchHandleClick} onblur={searchHandleClick}
									aria-activedescendant="option1" label='Transferee(Old Owner)' aria-autocomplete="list"
									aria-controls="listbox-id-12" role="textbox"
									placeholder="Search..."></lightning-input>
							</div>
							<!-- Start : Parent Search Result -->
							<div if:true={messageResult}>
								No Result Found!
							</div>
							<template if:true={showSearchedValues}>
								<div class="slds-box" style="height: 130px; overflow-y: scroll;">
									<ul class="" role="">
										<template for:each={userList} for:item="actObj">
											<li class="slds-p-around_x-small" style="cursor: pointer;" key={actObj.Id}
												onclick={parentHandleAction} data-value={actObj.Id}
												data-label={actObj.Name}>
												{actObj.Name}
											</li>
										</template>
									</ul>
								</div>
							</template>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="slds-p-around_medium">
			<template if:true={objectOptions}>
				<!--multi-select="true" -->
				<c-picklist multi-select="true" onselectoption={handleSelectOptionList} options={objectOptions}
					selected-values={selectedObjects} label="SObjects to Transferee "></c-picklist>
			</template>
		</div>
		<div class="slds-p-around_medium">
			<div class="slds-form-element">
				<div class="slds-form-element__control">
					<div class="slds-combobox_container">
						<div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
							aria-expanded="false" aria-haspopup="listbox" role="combobox">
							<div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
								role="none">
								<lightning-input type="search" id="combobox1-id-16" value={userName1}
									onchange={searchHandleKeyChange1} onkeydown={searchHandleClick1}
									onclick={searchHandleClick1} onblur={searchHandleClick1}
									aria-activedescendant="option" label='Transferor(New Owner) ' aria-autocomplete="list"
									aria-controls="listbox-id-12" role="textbox"
									placeholder="Search..."></lightning-input>
							</div>
							<!-- Start : Parent Search Result -->
							<div if:true={messageResult1}>
								No Result Found!
							</div>
							<template if:true={showSearchedValues1}>
								<div class="slds-box" style="height: 130px; overflow-y: scroll;">
									<ul class="" role="">
										<template for:each={userList1} for:item="actObj1">
											<li class="slds-p-around_x-small" style="cursor: pointer;" key={actObj1.Id}
												onclick={parentHandleAction1} data-value={actObj1.Id}
												data-label={actObj1.Name}>
												{actObj1.Name}
											</li>
										</template>
									</ul>
								</div>
							</template>
						</div>
					</div>
				</div>
			</div>
		</div>


		<div class="slds-p-around_medium">
			<lightning-button label="Get Record Count" disabled={disableButtons}
				onclick={handleButtonClick}></lightning-button>
			<template if:true={recordCounts}>
				<div>Record Count: {recordCounts}</div>
			</template>
		</div>
		<template if:true={records}>
			<ul>
				<template for:each={records} for:item="record">
					<li key={record.Id}>
						{record.Name} ({record.CreatedDate})
					</li>
				</template>
			</ul>
		</template>

		<div class="slds-p-around_medium">
			<lightning-button variant="Brand" label="Re-Assigne" title="Re-Assigne" disabled={disableButton}
				onclick={openModal}>
			</lightning-button>
		</div>

		<template if:true={isModalOpen}>
			<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
				aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<header class="slds-modal__header">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={closeModal}>
							<lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
								size="small"></lightning-icon>
							<span class="slds-assistive-text">Close</span>
						</button>
						<h3 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Re-Assigne</h3>
					</header>
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
						<p>Are You Sure want to transfer ownership of <b> {userName}</b> to <b>{userName1}?
							</b></p>
					</div>
					<footer class="slds-modal__footer">
						<button class="slds-button slds-button_neutral" onclick={closeModal}
							title="Cancel">Cancel</button>
						<button class="slds-button slds-button_brand" onclick={handleTransferOwnership}
							title="Yes">Yes</button>
					</footer>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</template>
	</div>
</template>
